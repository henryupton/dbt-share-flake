name: 'dbt_share_flake_integration_tests'
version: '1.0.0'
config-version: 2

profile: 'integration_tests'

# Configure test shares and listings
vars:
  snowflake_shares:
    test_share_1:
      accounts: []
      share_restrictions: false

  snowflake_listings:
    test_listing_1:
      title: "Test Internal Listing"
      description: "Integration test organization listing for dbt-share-flake"
      organization_profile: "INTERNAL"
      organization_targets:
        discovery:
          - account: "TEST_ACCOUNT"
            roles: ["ANALYST_ROLE"]
        access:
          - account: "TEST_ACCOUNT"
            roles: ["ANALYST_ROLE"]
      support_contact: "data-team@example.com"
      approver_contact: "data-governance@example.com"
      locations:
        access_regions:
          - name: "PUBLIC.AWS_US_WEST_2"

# Configure on-run-end hook to apply grants
on-run-end:
  - "{{ dbt_share_flake.entrypoint() }}"

model-paths: ["models"]
test-paths: ["tests"]
